# Test workload for scripts/k3d-helm-e2e.sh (namespace is set with kubectl -n):
#  - prometheus (agent mode): scrapes every pod in the namespace exposing an
#    "http-metrics" port and remote-writes to the distributor as tenant "e2e".
#  - toolbox: curl, used by the script to reach pod IPs inside the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-prometheus
subjects:
  - kind: ServiceAccount
    name: e2e-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      external_labels:
        e2e: k3d-helm
    scrape_configs:
      - job_name: mimir-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http-metrics
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_label_zone]
            target_label: zone
    remote_write:
      - url: http://mimir-distributor:8080/api/v1/push
        headers:
          X-Scope-OrgID: e2e
        queue_config:
          batch_send_deadline: 2s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-prometheus
  labels: {app: e2e-prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-prometheus}
  template:
    metadata:
      labels: {app: e2e-prometheus}
    spec:
      serviceAccountName: e2e-prometheus
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/prometheus
          resources:
            requests: {cpu: 20m, memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: e2e-prometheus}
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-toolbox
  labels: {app: e2e-toolbox}
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-toolbox}
  template:
    metadata:
      labels: {app: e2e-toolbox}
    spec:
      containers:
        - name: curl
          image: docker.io/curlimages/curl:8.15.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "trap : TERM INT; sleep infinity & wait"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
