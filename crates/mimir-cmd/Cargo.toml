[package]
name = "mimir-cmd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-common = { path = "../mimir-common" }
mimir-config = { path = "../mimir-config" }
mimir-ingester = { path = "../mimir-ingester" }
mimir-proto = { path = "../mimir-proto" }
mimir-ring = { path = "../mimir-ring" }
mimir-storage = { path = "../mimir-storage" }
mimir-tsdb = { path = "../mimir-tsdb" }
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "http1", "http2", "tokio"] }
libc = "0.2"
parking_lot = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
socket2 = { version = "0.5", features = ["all"] }
tokio-rustls = { workspace = true }
prometheus = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(unix)'.dependencies]
pprof = "0.14"
