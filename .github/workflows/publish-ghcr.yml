name: Publish Multi-Arch Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            SOURCE_DATE_EPOCH=0
            revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/birdayz/mimir-rs,push-by-digest=true,name-canonical=true,rewrite-timestamp=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
          cat "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & Tag Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest list and push tags
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "amd64 digest: ${AMD64_DIGEST}"
          echo "arm64 digest: ${ARM64_DIGEST}"
          docker buildx imagetools create \
            -t "ghcr.io/birdayz/mimir-rs:${GITHUB_SHA}" \
            -t "ghcr.io/birdayz/mimir-rs:${SHORT_SHA}" \
            -t "ghcr.io/birdayz/mimir-rs:main" \
            "ghcr.io/birdayz/mimir-rs@${AMD64_DIGEST}" \
            "ghcr.io/birdayz/mimir-rs@${ARM64_DIGEST}"
          docker buildx imagetools inspect "ghcr.io/birdayz/mimir-rs:${GITHUB_SHA}"
