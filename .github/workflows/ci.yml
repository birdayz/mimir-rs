name: CI

# Lint, unit/integration tests, upstream test parity, and the Go-vs-Rust conformance suites
# (Tier-1 oracle, twin-process, and Docker/testcontainers suites incl. Kafka TLS/SASL + outage,
# ring instance address in distroless pods). k3d + Helm e2e lives in k3d-helm-e2e.yml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIMIR_REF: 06de3ebd2b12aa22861b96e6863b93a162c31e3c
  REDPANDA_IMAGE: redpandadata/redpanda:v26.2.7@sha256:43545ee03966431f5451e0b3c1e651b39fbe3eb383360220311021f50133b649
  DISTROLESS_IMAGE: gcr.io/distroless/cc-debian13@sha256:809d04afa1be033c441f76bb0051878c342fb76d0ea236bc6dc94b655fa0fbd6
  SILO_IMAGE: pgsty/silo:RELEASE.2026-09-03T13-18-01Z@sha256:b616a0cf8cb281e7e6bb3c9b1fb53875b4016a2878223925541c18f82d6c5ca3
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Smaller target dirs on GitHub runners (debug info is not needed to run tests).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  lint:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit & integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Fetch upstream Go reference (.ref/mimir)
        run: |
          git init -q .ref/mimir
          git -C .ref/mimir remote add origin https://github.com/grafana/mimir.git
          git -C .ref/mimir fetch -q --depth 1 origin "$MIMIR_REF"
          git -C .ref/mimir checkout -q FETCH_HEAD
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo test (all crates except mimir-conformance)
        run: cargo test --workspace --exclude mimir-conformance

  parity:
    name: upstream test parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream Go reference (.ref/mimir)
        run: |
          git init -q .ref/mimir
          git -C .ref/mimir remote add origin https://github.com/grafana/mimir.git
          git -C .ref/mimir fetch -q --depth 1 origin "$MIMIR_REF"
          git -C .ref/mimir checkout -q FETCH_HEAD
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: verify-test-parity
        run: ./scripts/verify-test-parity.sh

  conformance:
    name: conformance (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [oracle, twin-process, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Fetch upstream Go reference (.ref/mimir)
        run: |
          git init -q .ref/mimir
          git -C .ref/mimir remote add origin https://github.com/grafana/mimir.git
          git -C .ref/mimir fetch -q --depth 1 origin "$MIMIR_REF"
          git -C .ref/mimir checkout -q FETCH_HEAD
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .ref/mimir/go.mod
          cache: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance-${{ matrix.shard }}
      - name: Select test targets
        id: targets
        run: |
          args=()
          for f in crates/mimir-conformance/tests/*.rs; do
            name=$(basename "$f" .rs)
            case "$name" in
              *testcontainers*) shard=docker ;;
              w4_*|w5_*) shard=twin-process ;;
              *) shard=oracle ;;
            esac
            [[ "$shard" == "${{ matrix.shard }}" ]] && args+=(--test "$name")
          done
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
          echo "selected: ${args[*]}"
      - name: Pull container images
        if: matrix.shard == 'docker'
        run: docker pull "$REDPANDA_IMAGE" && docker pull "$DISTROLESS_IMAGE" && docker pull pgsty/silo:RELEASE.2026-09-03T13-18-01Z && docker pull mcr.microsoft.com/azure-storage/azurite:latest && docker pull "$SILO_IMAGE"
      - name: Build Go mimir, Go oracle and Rust mimir
        run: |
          ./scripts/build-go-oracle.sh
          cargo build --release -p mimir-cmd
          cargo test -p mimir-conformance ${{ steps.targets.outputs.args }} --no-run
      - name: Run conformance tests
        run: cargo test -p mimir-conformance ${{ steps.targets.outputs.args }} -- --nocapture --test-threads 3
      - name: Remove leftover containers
        if: always() && matrix.shard == 'docker'
        run: docker ps -aq --filter label=org.mimir-rs.conformance | xargs -r docker rm -f
