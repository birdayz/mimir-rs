name: Kafka TLS/SASL conformance (OBSERV-1374)

# Go mimir vs Rust mimir against a real Redpanda (testcontainers-rs): TLS + SASL matrix,
# production TLS + SCRAM-SHA-256 end to end, and Kafka-unavailable-at-startup lifecycle parity.
# See crates/mimir-conformance/tests/w6_kafka_tls_sasl_testcontainers.rs.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIMIR_REF: 06de3ebd2b12aa22861b96e6863b93a162c31e3c
  REDPANDA_IMAGE: redpandadata/redpanda:v26.2.7@sha256:43545ee03966431f5451e0b3c1e651b39fbe3eb383360220311021f50133b649
  CARGO_TERM_COLOR: always

jobs:
  w6-kafka-tls-sasl:
    name: w6 Kafka TLS/SASL + outage (Go vs Rust, Redpanda)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream Go reference (.ref/mimir)
        run: |
          git init -q .ref/mimir
          git -C .ref/mimir remote add origin https://github.com/grafana/mimir.git
          git -C .ref/mimir fetch -q --depth 1 origin "$MIMIR_REF"
          git -C .ref/mimir checkout -q FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .ref/mimir/go.mod
          cache: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Pull Redpanda
        run: docker pull "$REDPANDA_IMAGE"

      - name: Build Go mimir, Go oracle and Rust mimir
        run: |
          ./scripts/build-go-oracle.sh
          cargo build --release -p mimir-cmd
          cargo test -p mimir-conformance --test w6_kafka_tls_sasl_testcontainers --no-run

      - name: Run w6 conformance
        run: cargo test -p mimir-conformance --test w6_kafka_tls_sasl_testcontainers -- --nocapture --test-threads 3

      - name: Remove leftover containers
        if: always()
        run: docker ps -aq --filter label=org.mimir-rs.conformance=observ-1374 | xargs -r docker rm -f
